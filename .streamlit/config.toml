[theme]
base = "light"
primaryColor = "#F4721E"
backgroundColor = "#E9D9CA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E2A3B"
font = "Montserrat, sans-serif"
headingFont = "Montserrat, sans-serif"
baseFontSize = 16

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
