[theme]
base = "light"
primaryColor = "#E85A0C"
backgroundColor = "#E4E3E1"
secondaryBackgroundColor = "#F9F9F8"
textColor = "#171717"
font = "Montserrat, sans-serif"
headingFont = "Montserrat, sans-serif"
baseFontSize = 16

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
